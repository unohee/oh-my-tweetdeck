name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    # The macOS 26 SDK is needed for the Liquid Glass APIs.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Build (warnings are errors)
        run: swift build -Xswiftc -warnings-as-errors

      - name: Test
        run: swift test

      - name: Bundle and smoke-test the app
        run: |
          scripts/build-app.sh release
          build/OhMyTweetDeck.app/Contents/MacOS/OhMyTweetDeck --smoke | tee smoke.txt
          grep -q "smoke ok" smoke.txt

      - name: Deploy script dry run into a temp folder
        env:
          OMT_INSTALL_DIR: ${{ runner.temp }}/Applications
        run: |
          scripts/deploy.sh
          scripts/deploy.sh  # second run exercises the replace-existing path
          "$OMT_INSTALL_DIR/OhMyTweetDeck.app/Contents/MacOS/OhMyTweetDeck" --smoke | grep -q "smoke ok"
